apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: voice-auth
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: backend
          image: voice-auth/backend:latest
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: voice-auth-config
            - secretRef:
                name: voice-auth-secrets
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: production
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: voice-auth
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-uploads
  namespace: voice-auth
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
  # For multi-node EKS use ReadWriteMany + EFS storageClass instead

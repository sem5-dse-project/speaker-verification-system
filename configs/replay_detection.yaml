# Replay detection configuration (Member 2)
seed: 42
sample_rate: 16000

data:
  root: data/asvspoof2017
  protocol_train: data/asvspoof2017/protocol_train.txt
  protocol_dev: data/asvspoof2017/protocol_dev.txt
  protocol_eval: data/asvspoof2017/protocol_eval.txt

features:
  n_mels: 64
  n_fft: 512
  hop_length: 160
  duration_sec: 3.0

model:
  channels: [16, 32, 64]
  dropout: 0.3

train:
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0

inference:
  threshold: 0.5
  device: cpu
  weights_path: null

evaluation:
  metrics: [eer, precision, recall, f1, confusion_matrix]

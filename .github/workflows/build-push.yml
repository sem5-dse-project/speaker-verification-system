name: Build and push images

on:
  push:
    branches: [main]
    paths:
      - "app/frontend/**"
      - "app/backend/**"
      - "app/server/**"
      - "deploy/docker/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: sem5-dse-project

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            file: deploy/docker/frontend.Dockerfile
            image: voice-auth-frontend
          - name: backend
            file: deploy/docker/backend.Dockerfile
            image: voice-auth-backend
          - name: ml-server
            file: deploy/docker/ml-server.Dockerfile
            image: voice-auth-ml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After all three images push, pin the same short SHA in Kustomize so ArgoCD rolls out.
  tag-bump:
    needs: build
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update production image tags
        id: bump
        run: |
          SHORT="sha-${GITHUB_SHA:0:7}"
          FILE="deploy/k8s/overlays/production/kustomization.yaml"
          sed -i "s/^    newTag: .*/    newTag: ${SHORT}/" "$FILE"
          echo "tag=${SHORT}" >> "$GITHUB_OUTPUT"
          echo "Updated tags to ${SHORT}"
          cat "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/overlays/production/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No tag changes"
            exit 0
          fi
          git commit -m "chore(deploy): bump k8s images to ${{ steps.bump.outputs.tag }} [skip ci]"
          git push
